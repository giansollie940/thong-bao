name: Test sidebar hero

on:
  push:
    branches: [main]
    paths:
      - 'tests/test_sidebar_icon_rail_hero.py'
      - 'index.html'
      - 'macos-glossy.css'
      - 'sidebar-collapse.js'
      - '.github/workflows/test-sidebar-hero.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_sidebar_icon_rail_hero.py
