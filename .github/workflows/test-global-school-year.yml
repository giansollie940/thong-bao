name: Test global school year

on:
  push:
    branches: [main]
    paths:
      - 'tests/test_global_school_year_switcher.py'
      - 'index.html'
      - 'app.js'
      - 'macos-glossy.css'
      - '.github/workflows/test-global-school-year.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_global_school_year_switcher.py
