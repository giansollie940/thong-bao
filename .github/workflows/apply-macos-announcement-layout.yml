name: Apply macOS announcement layout

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_macos_announcement_layout.py
      - tests/test_macos_announcement_layout.py
      - .github/workflows/apply-macos-announcement-layout.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply macOS layout patch
        run: |
          python scripts/apply_macos_announcement_layout.py
          git diff --check

      - name: Verify layout regression
        run: python tests/test_macos_announcement_layout.py

      - name: Verify existing editor regressions
        run: |
          python tests/test_toolbar_two_rows.py
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          for test in \
            tests/editor-word-toolbar-scroll-regression.html \
            tests/editor-word-toolbar-regression.html \
            tests/editor-sequential-formatting-sync.html \
            tests/editor-multiblock-regression.html \
            tests/editor-offset-selection-regression.html; do
            out="/tmp/$(basename "$test").html"
            timeout 25s "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --allow-file-access-from-files --virtual-time-budget=5000 --dump-dom "file://$PWD/$test" > "$out"
            grep 'id="test-output"' "$out" || true
            grep 'data-test-status="pass"' "$out"
          done

      - name: Commit production layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html announcement-form.css rich-editor.css
          git commit -m "Reorganize announcement composer with macOS styling"
          git push
