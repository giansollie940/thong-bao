name: Test editor toggle regression

on:
  push:
    branches: [main]
    paths:
      - tests/editor-sequential-formatting-sync.html
      - rich-editor.js
      - .github/workflows/test-editor-toggle.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run toggle regression
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          timeout 25s "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --allow-file-access-from-files --virtual-time-budget=5000 --dump-dom "file://$PWD/tests/editor-sequential-formatting-sync.html" > /tmp/toggle.html
          grep 'id="test-output"' /tmp/toggle.html
          grep 'data-test-status="pass"' /tmp/toggle.html
