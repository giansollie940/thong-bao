name: Test macOS announcement layout

on:
  push:
    branches: [main]
    paths:
      - tests/test_macos_announcement_layout.py
      - index.html
      - announcement-form.css
      - rich-editor.css
      - .github/workflows/test-macos-announcement-layout.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run macOS layout regression
        run: python tests/test_macos_announcement_layout.py
