name: Fix editor logical selection

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-editor-logical-selection.yml
      - tests/patch-logical-selection.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch production code
        run: |
          python tests/patch-logical-selection.py
          node --check rich-editor.js
          git diff --check

      - name: Verify logical selection regression
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          timeout 25s "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --allow-file-access-from-files --virtual-time-budget=5000 --dump-dom "file://$PWD/tests/editor-offset-selection-regression.html" > /tmp/selection.html
          grep 'id="test-output"' /tmp/selection.html
          grep 'data-test-status="pass"' /tmp/selection.html

      - name: Verify normal sequential formatting
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          timeout 25s "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --allow-file-access-from-files --virtual-time-budget=5000 --dump-dom "file://$PWD/tests/editor-sequential-formatting-sync.html" > /tmp/sequential.html
          grep 'id="test-output"' /tmp/sequential.html
          grep 'data-test-status="pass"' /tmp/sequential.html

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rich-editor.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Persist editor selection across formatting commands"
            git push
          fi
