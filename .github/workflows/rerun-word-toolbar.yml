name: Refine Word-like toolbar

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rerun-word-toolbar.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply base patch and refine active states
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/fix-word-toolbar.yml').read_text(encoding='utf-8')
          start = workflow.index("          from pathlib import Path\n")
          end = workflow.index("          PY\n", start)
          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, 'base-word-toolbar-patch', 'exec'))

          path = Path('editor-formatting.js')
          text = path.read_text(encoding='utf-8')
          old = '''    toolbar.addEventListener("click", event => {\n      if (!event.target.closest('[data-format="bold"], [data-format="italic"], [data-format="underline"], [data-format="strike"]')) return;\n      requestAnimationFrame(updateInlineButtonStates);\n    });\n\n    document.addEventListener("selectionchange", () => {\n      const selection = window.getSelection();\n      if (!selection?.rangeCount) return;\n      const range = selection.getRangeAt(0);\n      const visual = root.querySelector("#announcement-visual-editor");\n      const node = range.commonAncestorContainer;\n      const element = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;\n      if (visual && element && (element === visual || visual.contains(element))) {\n        requestAnimationFrame(updateInlineButtonStates);\n      }\n    });\n\n'''
          new = '''    toolbar.addEventListener("click", event => {\n      const button = event.target.closest(\n        '[data-format="bold"], [data-format="italic"], [data-format="underline"], [data-format="strike"]'\n      );\n      if (!button) return;\n\n      /*\n       * The rich-editor click handler runs first and performs the actual\n       * toggle. Mirror that toggle deterministically on the toolbar button\n       * so focus/selection restoration cannot leave stale visual state.\n       */\n      const nextActive = button.getAttribute("aria-pressed") !== "true";\n      button.classList.toggle("active", nextActive);\n      button.setAttribute("aria-pressed", String(nextActive));\n    });\n\n'''
          if old not in text:
              raise SystemExit('active state listener marker missing')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          node --check editor-formatting.js
          git diff --check

      - name: Verify all editor regressions
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          for test in tests/editor-word-toolbar-regression.html tests/editor-sequential-formatting-sync.html tests/editor-multiblock-regression.html tests/editor-offset-selection-regression.html; do
            out="/tmp/$(basename "$test").html"
            timeout 25s "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --allow-file-access-from-files --virtual-time-budget=5000 --dump-dom "file://$PWD/$test" > "$out"
            grep 'id="test-output"' "$out" || true
            grep 'data-test-status="pass"' "$out"
          done

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor-formatting.js editor-formatting.css controls.css index.html
          git commit -m "Make formatting toolbar behave like Word"
          git push
