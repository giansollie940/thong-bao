name: Apply editor cache bump

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-editor-cache-bump.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump editor asset cache key
        run: sed -i 's/?v=3\.16\.5/?v=3.16.7/g' index.html
      - name: Commit cache bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Bump editor asset cache to 3.16.7"
            git push
          fi
