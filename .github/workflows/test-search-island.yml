name: Test search island

on:
  push:
    branches: [main]
    paths:
      - 'tests/test_search_island_sidebar_toggle.py'
      - 'index.html'
      - 'macos-glossy.css'
      - '.github/workflows/test-search-island.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_search_island_sidebar_toggle.py
