<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Sequential editor formatting regression</title>
</head>
<body>
  <div id="announcement-rich-editor">
    <div id="announcement-format-toolbar">
      <select id="announcement-font-family">
        <option value="">Font</option>
        <option value="Georgia, serif">Georgia</option>
      </select>
      <select id="announcement-font-size">
        <option value="">Size</option>
        <option value="24px">24</option>
      </select>
      <button id="announcement-color-more" type="button" data-editor-format-toggle="color">Màu</button>
      <button id="announcement-align-more" type="button" data-editor-format-toggle="align">Căn</button>
      <button type="button" data-editor-clear-format>Tx</button>
    </div>

    <section id="announcement-format-panel" hidden>
      <div class="editor-format-panel-group" data-editor-format-section="align">
        <button type="button" data-editor-align="left">Trái</button>
      </div>
      <div class="editor-format-panel-group" data-editor-format-section="color">
        <button type="button" data-editor-text-color="#1565c0">Blue</button>
        <input id="announcement-text-color" type="color" value="#243a33">
      </div>
      <div class="editor-format-panel-group" data-editor-format-section="color">
        <button type="button" data-editor-highlight-color="#fff2a8">Yellow</button>
        <input id="announcement-highlight-color" type="color" value="#fff2a8">
      </div>
      <p class="editor-format-panel-hint"></p>
    </section>

    <button type="button" data-editor-view="visual">Visual</button>
    <button type="button" data-editor-view="html">HTML</button>
    <div data-editor-panel="visual">
      <div id="announcement-visual-editor" contenteditable="true"></div>
    </div>
    <div data-editor-panel="html" hidden>
      <textarea id="announcement-content"></textarea>
      <pre id="announcement-html-lines"></pre>
    </div>
    <div id="announcement-editor-status"></div>
    <div id="announcement-editor-count"></div>
  </div>
  <pre id="test-output">RUNNING</pre>

  <script src="../content-renderer.js"></script>
  <script src="../rich-editor.js"></script>
  <script src="../editor-formatting.js"></script>
  <script>
    (async () => {
      const sample = `*Thời gian: ****Ngày 04/09/2026 ( tiết 8,9 thứ 6)***
*Khung chương trình:*
*14h40-14h50: Học sinh tập trung ở hội trường*
*14h50-15h30: Tập huấn chung ở hội trường.*
*15h30-16h20\\:Tập huấn riêng từng chức danh ở các phòng*

- *Phòng Lớp trưởng: A302*
- *Phòng Lớp phó học tập: B304*
- *Phòng Lớp phó kỷ luật: B308*
- *Phòng Cán sự thư viện: Thư viện B209*
- *Phòng Cán sự tư vấn-y tế: A209-B208*
- *Phòng Cán sự Văn – Thể - Mỹ: AB10*

*Cán sự khi tập huấn mang theo 1 quyển sổ nhỏ và bút để ghi chép và mang theo ba lô khi kết thúc chương trình thì ra về luôn, không cần quay lại phòng chủ nhiệm*`;

      const root = document.querySelector('#announcement-rich-editor');
      const visual = document.querySelector('#announcement-visual-editor');
      const output = document.querySelector('#test-output');
      const fontSelect = document.querySelector('#announcement-font-family');
      const sizeSelect = document.querySelector('#announcement-font-size');

      const editor = window.WeeklyRichEditor.create({
        root,
        renderer: window.WeeklyContent
      });
      window.WeeklyEditorFormatting.create({ root, editor });

      const nextFrames = async (count = 3) => {
        for (let i = 0; i < count; i += 1) {
          await new Promise(resolve => requestAnimationFrame(resolve));
        }
      };

      function textNodesInBlocks() {
        const walker = document.createTreeWalker(visual, NodeFilter.SHOW_TEXT);
        const nodes = [];
        let node = walker.nextNode();
        while (node) {
          if (
            node.nodeValue?.trim() &&
            node.parentElement?.closest('p, li')
          ) {
            nodes.push(node);
          }
          node = walker.nextNode();
        }
        return nodes;
      }

      function selectAllText() {
        const nodes = textNodesInBlocks();
        const range = document.createRange();
        range.setStart(nodes[0], 0);
        range.setEnd(nodes[nodes.length - 1], nodes[nodes.length - 1].nodeValue.length);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        editor.captureSelection();
      }

      function hasAncestorStyle(node, property, expected) {
        let element = node.parentElement;
        while (element && element !== visual) {
          if (element.style?.getPropertyValue(property) === expected) return true;
          element = element.parentElement;
        }
        return false;
      }

      function styleCoverage(property, expected) {
        const nodes = textNodesInBlocks();
        const covered = nodes.filter(node => hasAncestorStyle(node, property, expected));
        return { total: nodes.length, covered: covered.length };
      }

      function selectionTextLength() {
        return window.getSelection()?.toString().trim().length || 0;
      }

      function useSelect(select, value) {
        select.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
        select.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
        select.focus();
        select.value = value;
        select.dispatchEvent(new Event('change', { bubbles: true }));
      }

      const failures = [];
      editor.setHtml(window.WeeklyContent.renderMarkdown(sample), {
        view: 'visual',
        focus: false
      });
      selectAllText();
      const initialSelectionLength = selectionTextLength();

      useSelect(fontSelect, 'Georgia, serif');
      await nextFrames();
      const fontCoverage = styleCoverage('font-family', 'Georgia, serif');
      const afterFontSelectionLength = selectionTextLength();

      useSelect(sizeSelect, '24px');
      await nextFrames();
      const sizeCoverage = styleCoverage('font-size', '24px');
      const finalFontCoverage = styleCoverage('font-family', 'Georgia, serif');
      const afterSizeSelectionLength = selectionTextLength();

      if (fontCoverage.covered !== fontCoverage.total) {
        failures.push(`font ${fontCoverage.covered}/${fontCoverage.total}`);
      }
      if (sizeCoverage.covered !== sizeCoverage.total) {
        failures.push(`size-after-font ${sizeCoverage.covered}/${sizeCoverage.total}`);
      }
      if (finalFontCoverage.covered !== finalFontCoverage.total) {
        failures.push(`font-lost-after-size ${finalFontCoverage.covered}/${finalFontCoverage.total}`);
      }
      if (!afterFontSelectionLength || afterFontSelectionLength < initialSelectionLength * 0.9) {
        failures.push(`selection-after-font ${afterFontSelectionLength}/${initialSelectionLength}`);
      }
      if (!afterSizeSelectionLength || afterSizeSelectionLength < initialSelectionLength * 0.9) {
        failures.push(`selection-after-size ${afterSizeSelectionLength}/${initialSelectionLength}`);
      }

      const detail = [
        `font=${fontCoverage.covered}/${fontCoverage.total}`,
        `size=${sizeCoverage.covered}/${sizeCoverage.total}`,
        `finalFont=${finalFontCoverage.covered}/${finalFontCoverage.total}`,
        `selection=${initialSelectionLength}->${afterFontSelectionLength}->${afterSizeSelectionLength}`
      ].join('; ');

      if (failures.length) {
        output.textContent = `FAIL: ${failures.join('; ')} | ${detail}`;
        document.body.dataset.testStatus = 'fail';
      } else {
        output.textContent = `PASS: sequential Font -> Size keeps same selection | ${detail}`;
        document.body.dataset.testStatus = 'pass';
      }
    })();
  </script>
</body>
</html>
