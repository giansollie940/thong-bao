<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Sequential formatting sync regression</title></head><body>
<div id="announcement-rich-editor">
  <div id="announcement-format-toolbar">
    <select id="announcement-font-family"><option value="">Font</option><option value="Georgia, serif">Georgia</option></select>
    <select id="announcement-font-size"><option value="">Size</option><option value="24px">24</option></select>
    <button type="button" data-format="bold">B</button>
    <button id="announcement-color-more" type="button" data-editor-format-toggle="color">Màu</button>
    <button id="announcement-align-more" type="button" data-editor-format-toggle="align">Căn</button>
    <button type="button" data-editor-clear-format>Tx</button>
  </div>
  <section id="announcement-format-panel" hidden>
    <div class="editor-format-panel-group" data-editor-format-section="align"><button type="button" data-editor-align="left">Trái</button></div>
    <div class="editor-format-panel-group" data-editor-format-section="color"><button type="button" data-editor-text-color="#1565c0">Blue</button><input id="announcement-text-color" type="color" value="#243a33"></div>
    <div class="editor-format-panel-group" data-editor-format-section="color"><button type="button" data-editor-highlight-color="#fff2a8">Yellow</button><input id="announcement-highlight-color" type="color" value="#fff2a8"></div>
    <p class="editor-format-panel-hint"></p>
  </section>
  <button type="button" data-editor-view="visual">Visual</button><button type="button" data-editor-view="html">HTML</button>
  <div data-editor-panel="visual"><div id="announcement-visual-editor" contenteditable="true"></div></div>
  <div data-editor-panel="html" hidden><textarea id="announcement-content"></textarea><pre id="announcement-html-lines"></pre></div>
  <div id="announcement-editor-status"></div><div id="announcement-editor-count"></div>
</div>
<pre id="test-output">RUNNING</pre>
<script src="../content-renderer.js"></script><script src="../rich-editor.js"></script><script src="../editor-formatting.js"></script>
<script>
(() => {
const sample='<p>Alpha Beta Gamma</p><p>Delta Epsilon Theta</p><ul><li>Zeta Eta Iota</li><li>Kappa Lambda Mu</li></ul>';
const root=document.querySelector('#announcement-rich-editor'),visual=document.querySelector('#announcement-visual-editor'),out=document.querySelector('#test-output');
const editor=WeeklyRichEditor.create({root,renderer:WeeklyContent}); WeeklyEditorFormatting.create({root,editor});
function textNodes(){const w=document.createTreeWalker(visual,NodeFilter.SHOW_TEXT),a=[];let n=w.nextNode();while(n){if(n.nodeValue?.trim()&&n.parentElement?.closest('p,li'))a.push(n);n=w.nextNode()}return a}
function selectAll(){const a=textNodes(),r=document.createRange();r.setStart(a[0],0);r.setEnd(a[a.length-1],a[a.length-1].nodeValue.length);const s=getSelection();s.removeAllRanges();s.addRange(r);editor.captureSelection()}
function styleCoverage(prop,val){const a=textNodes();return {total:a.length,covered:a.filter(n=>{let e=n.parentElement;while(e&&e!==visual){if(e.style?.getPropertyValue(prop)===val)return true;e=e.parentElement}return false}).length}}
function effectiveBold(node){const value=getComputedStyle(node.parentElement).fontWeight;return value==='bold'||Number.parseInt(value,10)>=600}
function boldCoverage(){const a=textNodes();return {total:a.length,covered:a.filter(effectiveBold).length}}
function len(){return getSelection()?.toString().trim().length||0}
function useSelect(id,value){const s=document.querySelector(id);s.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true}));s.dispatchEvent(new MouseEvent('mousedown',{bubbles:true}));s.focus();s.value=value;s.dispatchEvent(new Event('change',{bubbles:true}))}
function clickFormat(format){const b=document.querySelector(`[data-format="${format}"]`);b.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,cancelable:true}));b.dispatchEvent(new MouseEvent('mousedown',{bubbles:true,cancelable:true}));b.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}))}
editor.setHtml(sample,{view:'visual',focus:false});selectAll();const start=len();
useSelect('#announcement-font-family','Georgia, serif');
setTimeout(()=>{const font=styleCoverage('font-family','Georgia, serif'),afterFont=len();useSelect('#announcement-font-size','24px');
setTimeout(()=>{const size=styleCoverage('font-size','24px'),afterSize=len();clickFormat('bold');
setTimeout(()=>{const boldOn=boldCoverage(),afterBoldOn=len();clickFormat('bold');
setTimeout(()=>{const boldOff=boldCoverage(),fontFinal=styleCoverage('font-family','Georgia, serif'),sizeFinal=styleCoverage('font-size','24px'),afterBoldOff=len(),failures=[];
if(font.covered!==font.total)failures.push(`font ${font.covered}/${font.total}`);
if(size.covered!==size.total)failures.push(`size ${size.covered}/${size.total}`);
if(boldOn.covered!==boldOn.total)failures.push(`bold-on ${boldOn.covered}/${boldOn.total}`);
if(boldOff.covered!==0)failures.push(`bold-off ${boldOff.covered}/${boldOff.total}`);
if(fontFinal.covered!==fontFinal.total)failures.push(`font-lost ${fontFinal.covered}/${fontFinal.total}`);
if(sizeFinal.covered!==sizeFinal.total)failures.push(`size-lost ${sizeFinal.covered}/${sizeFinal.total}`);
for(const [label,value] of [['font',afterFont],['size',afterSize],['bold-on',afterBoldOn],['bold-off',afterBoldOff]])if(value<start*.9)failures.push(`selection-after-${label} ${value}/${start}`);
const detail=`font=${fontFinal.covered}/${fontFinal.total}; size=${sizeFinal.covered}/${sizeFinal.total}; boldOn=${boldOn.covered}/${boldOn.total}; boldOff=${boldOff.covered}/${boldOff.total}; selection=${start}->${afterFont}->${afterSize}->${afterBoldOn}->${afterBoldOff}`;
out.textContent=(failures.length?`FAIL: ${failures.join('; ')} | `:'PASS: ')+detail;document.body.dataset.testStatus=failures.length?'fail':'pass';
},50)},50)},50)},50);
})();
</script></body></html>
